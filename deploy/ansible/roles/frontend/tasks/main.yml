---
- name: Ensure nginx is installed
  ansible.builtin.package:
    name: nginx
    state: present

- name: Install npm dependencies (lockfile-exact)
  ansible.builtin.command:
    cmd: npm ci --no-audit --no-fund
    chdir: "{{ frontend_source_dir }}"
  changed_when: true

- name: Build frontend (type-check + vite build)
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ frontend_source_dir }}"
  environment:
    # Origin only; the client appends /api/v1. Without it the SPA posts to its
    # own static vhost, which answers 405 to every API call.
    VITE_API_BASE_URL: "{{ frontend_api_base_url }}"
  changed_when: true

- name: Remove previously installed assets
  ansible.builtin.file:
    path: "{{ frontend_install_dir }}"
    state: absent
  # Stale content-hashed bundles would otherwise accumulate across deploys.
  # The docroot is briefly empty between this task and the copy below.

- name: Install built assets
  ansible.builtin.copy:
    src: "{{ frontend_source_dir }}/dist/"
    remote_src: true
    dest: "{{ frontend_install_dir }}/"
  # File modes come from the build output (root umask 022): dirs 0755,
  # files 0644. No mode= here on purpose — a single mode would apply to
  # directories too and 0644 dirs are unreadable.
  notify: Reload nginx for frontend

- name: Install vhost configuration
  ansible.builtin.template:
    src: wonder-critique-frontend.conf.j2
    dest: "{{ frontend_nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx for frontend

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Check the SPA vhost responds
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
    headers:
      Host: "{{ vault_frontend_domain }}"
    status_code: 200
    return_content: true
  register: frontend_probe
  until: frontend_probe.status == 200
  retries: 5
  delay: 2

- name: Report readiness
  ansible.builtin.debug:
    msg: "frontend ready at http://{{ vault_frontend_domain }}/ (docroot {{ frontend_install_dir }})"
