---
# Defaults for the backend systemd service.
backend_service_name: wonder-critique-backend

# Where the built binary is installed.
backend_install_dir: /opt/wonder-critique
backend_binary_path: "{{ backend_install_dir }}/bin/server"

# State (sqlite db) lives under StateDirectory.
backend_state_dir: /var/lib/wonder-critique

# Runtime env file.
backend_env_file: /etc/wonder-critique/backend.env
backend_env_mode: "0640"

backend_app_env: prod
backend_log_level: info
backend_port: 11111
backend_http_addr: "127.0.0.1:{{ backend_port }}"
backend_db_path: "{{ backend_state_dir }}/app.db"
backend_jwt_issuer: wonder-critique
backend_agent_model: muse-spark-1.3-contributor

# Source tree to build. Default = sibling of this deploy directory.
backend_source_dir: "{{ playbook_dir }}/../../apps/backend"
backend_build_env:
  CGO_ENABLED: "0"        # pure-Go sqlite (glebarez) needs no cgo
  GOFLAGS: ""

# Build flags (mirror of apps/backend Taskfile).
backend_build_flags: -trimpath -ldflags "-s -w"

# --- render (headless Chrome screenshots; see docs/backend.render.md) ---
# Browser executable for the renderer; empty = renderer auto-detects
# (PATH, well-known locations, Playwright caches).
backend_render_chrome_path: ""
# Parallel renders per process and hard deadline per render.
backend_render_concurrency: 2
backend_render_timeout: "20s"
# Extra hosts fragments may load from (Google Fonts hosts always allowed).
backend_render_allowed_hosts: []
# Never true in production: Chrome keeps its sandbox.
backend_render_chrome_no_sandbox: false
