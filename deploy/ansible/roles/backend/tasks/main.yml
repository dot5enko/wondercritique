---
- name: Create system user for the backend
  ansible.builtin.group:
    name: "{{ backend_service_name }}"
    system: true
  register: backend_group

- name: Create service user
  ansible.builtin.user:
    name: "{{ backend_service_name }}"
    group: "{{ backend_service_name }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ backend_state_dir }}"
    create_home: false
    comment: wonder-critique backend service account

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ backend_install_dir }}/bin"
      mode: "0755"
    - path: "/etc/wonder-critique"
      mode: "0750"
      group: "{{ backend_service_name }}"

- name: Build server binary from source
  ansible.builtin.command:
    cmd: >-
      go build {{ backend_build_flags }}
      -o {{ backend_source_dir }}/bin/server ./cmd/server
    chdir: "{{ backend_source_dir }}"
  environment: "{{ backend_build_env }}"
  changed_when: true

- name: Install server binary
  ansible.builtin.copy:
    src: "{{ backend_source_dir }}/bin/server"
    remote_src: true
    dest: "{{ backend_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart backend

- name: Install environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ backend_env_file }}"
    owner: root
    group: "{{ backend_service_name }}"
    mode: "{{ backend_env_mode }}"
  notify: Restart backend

- name: Install systemd unit
  ansible.builtin.template:
    src: wonder-critique-backend.service.j2
    dest: /etc/systemd/system/{{ backend_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart backend

- name: Flush handlers before ensuring service state
  ansible.builtin.meta: flush_handlers

- name: Enable and start backend service
  ansible.builtin.systemd_service:
    name: "{{ backend_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for backend to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ backend_port }}"
    timeout: 30

- name: Check readiness endpoint
  ansible.builtin.uri:
    url: "http://{{ backend_http_addr }}/readyz"
    return_content: true
  register: backend_readyz
  until: backend_readyz.status == 200
  retries: 5
  delay: 2

- name: Report readiness
  ansible.builtin.debug:
    msg: "backend ready: {{ backend_readyz.content | default('') }} (listening on {{ backend_http_addr }})"
