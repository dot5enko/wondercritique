---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Install vhost configuration
  ansible.builtin.template:
    src: wonder-critique-api.conf.j2
    dest: "{{ nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Check nginx responds for the vhost
  ansible.builtin.uri:
    url: "http://127.0.0.1/healthz"
    headers:
      Host: "{{ vault_backend_domain }}"
    status_code: 200
    return_content: true
  register: nginx_probe
  until: nginx_probe.status == 200
  retries: 5
  delay: 2
