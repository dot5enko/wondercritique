---
# Public (non-secret) deployment variables.
# Secrets live in group_vars/all/vault.yml which must NOT be committed.
vault_jwt_secret: ""
vault_secrets_key: ""
vault_resend_api_key: ""
vault_mail_from: ""
vault_model_api_key: ""

# Virtual domains nginx serves (values live in vault.yml).
vault_backend_domain: ""
vault_frontend_domain: ""

# TLS is terminated at Cloudflare in front of this machine; the origin nginx
# serves plain HTTP on port 80 and must not listen on 443.

# CORS origins allowed to call the API (rendered into CORS_ORIGINS env var,
# comma separated). Add your frontend origins here, e.g.:
backend_cors_origins:
  - "https://{{ vault_frontend_domain }}"
